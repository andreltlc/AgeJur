<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Jurídica</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a3a5c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Agenda Jur.">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
    <span class="header-icon">⚖️</span>
    <div class="header-info">
        <h1>Agenda Jurídica</h1>
        <div class="subtitle">Controle de prazos e audiências</div>
    </div>
    <div class="header-actions">
        <span class="user-email" id="user-email"></span>
        <button onclick="logout()" class="btn-sair">Sair</button>
    </div>
</header>

<!-- Banner de instalação iOS (visível só no Safari do iPhone/iPad) -->
<div id="ios-banner" class="ios-banner hidden">
    <span class="ios-banner-icon">📲</span>
    <span>Para instalar: toque em <strong>Compartilhar</strong> e depois em <strong>"Adicionar à Tela de Início"</strong></span>
    <button id="ios-banner-fechar">✕</button>
</div>

<div class="mobile-tabs">
    <button class="active" data-tab="prazos">⏳ Prazos</button>
    <button data-tab="audiencias">🎤 Audiências</button>
</div>

<div class="main">

    <!-- COLUNA: Prazos -->
    <div class="column active" id="col-prazos">
        <div class="column-header">
            <div class="column-title">
                <span class="icon">⏳</span>
                <h2>Prazos</h2>
                <span class="badge" id="badge-prazos">0</span>
            </div>
            <button class="btn btn-primary" id="btn-novo-prazo">+ Novo Prazo</button>
        </div>
        <div id="list-prazos" class="items-list"></div>
    </div>

    <!-- COLUNA: Audiências -->
    <div class="column" id="col-audiencias">
        <div class="column-header hearings">
            <div class="column-title">
                <span class="icon">🎤</span>
                <h2>Audiências</h2>
                <span class="badge gold" id="badge-audiencias">0</span>
            </div>
            <button class="btn btn-gold" id="btn-nova-audiencia">+ Nova Audiência</button>
        </div>
        <div id="list-audiencias" class="items-list"></div>
    </div>

</div>

<!-- MODAL: Novo / Editar Prazo -->
<div class="modal-overlay" id="modal-prazo">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">⏳ <span id="modal-prazo-title">Novo Prazo</span></div>
            <button class="modal-close" data-close="modal-prazo">✕</button>
        </div>
        <input type="hidden" id="prazo-edit-id">
        <div class="form-group">
            <label for="prazo-titulo">Descrição do Prazo *</label>
            <input type="text" id="prazo-titulo" placeholder="Ex: Recurso de Apelação – Processo 0001234-56">
        </div>
        <div class="form-group">
            <label for="prazo-obs">Observações</label>
            <textarea id="prazo-obs" placeholder="Detalhes adicionais..."></textarea>
        </div>
        <div class="form-group">
            <label for="prazo-data">Data limite *</label>
            <input type="date" id="prazo-data">
        </div>
        <div class="form-actions">
            <button class="btn btn-outline" data-close="modal-prazo">Cancelar</button>
            <button class="btn btn-primary" id="btn-salvar-prazo">Salvar</button>
        </div>
    </div>
</div>

<!-- MODAL: Nova / Editar Audiência -->
<div class="modal-overlay" id="modal-audiencia">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">🎤 <span id="modal-audiencia-title">Nova Audiência</span></div>
            <button class="modal-close" data-close="modal-audiencia">✕</button>
        </div>
        <input type="hidden" id="audiencia-edit-id">
        <div class="form-group">
            <label for="audiencia-titulo">Descrição da Audiência *</label>
            <input type="text" id="audiencia-titulo" placeholder="Ex: Audiência de Instrução – Processo 0001234-56">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="audiencia-data">Data *</label>
                <input type="date" id="audiencia-data">
            </div>
            <div class="form-group">
                <label for="audiencia-hora">Horário *</label>
                <input type="time" id="audiencia-hora">
            </div>
        </div>
        <div class="toggle-row">
            <label class="toggle">
                <input type="checkbox" id="audiencia-online">
                <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label">Audiência Online</span>
        </div>
        <div class="form-group" id="campo-local">
            <label for="audiencia-local">Local *</label>
            <input type="text" id="audiencia-local" placeholder="Ex: Vara Cível da Comarca de São Paulo">
        </div>
        <div class="form-group hidden" id="campo-link">
            <label for="audiencia-link">Link da Reunião *</label>
            <input type="url" id="audiencia-link" placeholder="https://meet.google.com/...">
        </div>
        <div class="form-group">
            <label for="audiencia-obs">Observações</label>
            <textarea id="audiencia-obs" placeholder="Detalhes adicionais..."></textarea>
        </div>
        <div class="form-actions">
            <button class="btn btn-outline" data-close="modal-audiencia">Cancelar</button>
            <button class="btn btn-gold" id="btn-salvar-audiencia">Salvar</button>
        </div>
    </div>
</div>

<!-- MODAL: Concluir Prazo (Protocolo) -->
<div class="modal-overlay" id="modal-protocolo">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">✅ Concluir Prazo</div>
            <button class="modal-close" data-close="modal-protocolo">✕</button>
        </div>
        <input type="hidden" id="protocolo-prazo-id">
        <p class="modal-info">Deseja registrar o número ou texto do protocolo?</p>
        <div class="form-group">
            <label for="protocolo-texto">Número / Texto do Protocolo</label>
            <textarea id="protocolo-texto" placeholder="Ex: Protocolo nº 123456, enviado via e-SAJ em 14/04/2026..."></textarea>
        </div>
        <div class="form-actions">
            <button class="btn btn-outline" data-close="modal-protocolo">Cancelar</button>
            <button class="btn btn-success" id="btn-confirmar-conclusao">Confirmar Conclusão</button>
        </div>
    </div>
</div>

<!-- MODAL: Visualizar Protocolo -->
<div class="modal-overlay" id="modal-ver-protocolo">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">📋 Protocolo Anexado</div>
            <button class="modal-close" data-close="modal-ver-protocolo">✕</button>
        </div>
        <div id="ver-protocolo-content"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/prazos.js"></script>
<script src="js/audiencias.js"></script>
<script src="js/app.js"></script>
</body>
</html>
