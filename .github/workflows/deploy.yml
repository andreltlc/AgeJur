name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy to Firebase (Hosting + Functions + Firestore Rules)
        run: npx firebase-tools deploy --only hosting,functions,firestore --token ${{ secrets.FIREBASE_TOKEN }} --non-interactive
